---
# Debian and Ubuntu.
_s4m_packages:
  - git
  - openssl
  - python3
  - python3-venv
  - apache2
_s4m_samba_python_packages:
  - python3-samba

_s4m_apache_service: apache2
_s4m_apache_ctl: apache2ctl
_s4m_apache_conf: /etc/apache2/sites-available/samba4_manager.conf
_s4m_apache_log_dir: /var/log/apache2
_s4m_apache_modules:
  - proxy
  - proxy_http
  - headers
  - ssl
_s4m_apache_site_name: samba4_manager
_s4m_apache_init_unit: ""
_s4m_apache_default_cert: ""

_s4m_tls_cert_default: /etc/ssl/certs/samba4_manager.crt
_s4m_tls_key_default: /etc/ssl/private/samba4_manager.key
_s4m_ca_cert_default: /etc/ssl/certs/samba4_manager-ca.crt
_s4m_ca_key_default: /etc/ssl/private/samba4_manager-ca.key

_s4m_nologin: /usr/sbin/nologin
