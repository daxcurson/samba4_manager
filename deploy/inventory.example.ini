# Copy this file to inventory.ini and adjust it.
# Each host is a Samba AD domain controller where the application will run.

[samba4_manager]
dc1.example.com ansible_user=admin

# To install on the machine you are logged into, use instead:
# localhost ansible_connection=local

[samba4_manager:vars]
# Name users will type in the browser (defaults to the host's FQDN).
# samba4_manager_server_name=dc1.example.com

# Branch, tag or commit to deploy.
# samba4_manager_version=master

# Use your own certificate instead of a self-signed one.
# samba4_manager_tls_cert=/etc/pki/tls/certs/dc1.example.com.crt
# samba4_manager_tls_key=/etc/pki/tls/private/dc1.example.com.key
