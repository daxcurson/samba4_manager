###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:samba4-manager

pyramid.reload_templates = true
pyramid.debug_authorization = true
pyramid.debug_notfound = true
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# Development-only secrets. Production installs generate their own.
samba4_manager.session_secret = dev-session-secret-change-me
samba4_manager.auth_secret = dev-auth-secret-change-me
samba4_manager.secure_cookies = false
# Seconds of inactivity before having to log in again (default 1800).
# samba4_manager.session_timeout = 1800
# SIDs of the groups allowed to log in (default BUILTIN\Administrators).
# samba4_manager.admin_groups = S-1-5-32-544

# Requires: pip install -e ".[dev]"
pyramid.includes =
    pyramid_debugtoolbar

# By default, the toolbar only appears for clients from IP addresses
# '127.0.0.1' and '::1'.
debugtoolbar.hosts = 127.0.0.1 ::1 192.168.1.1

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = *:6543

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, samba4_manager

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_samba4_manager]
level = DEBUG
handlers =
qualname = samba4_manager

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
